# Render Infrastructure as Code — BPR Clinic
# Deploy via: dashboard.render.com → New → Blueprint → connect GitHub repo brunoto02028/clinic
# Render will read this file and create EVERYTHING automatically.
# After blueprint setup, fill in the SECRET values marked with sync: false

services:
  - type: web
    name: bpr-clinic
    env: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Database — auto-linked to the Render PostgreSQL below
      - key: DATABASE_URL
        fromDatabase:
          name: bpr-clinic-db
          property: connectionString

      # Auth
      - key: NEXTAUTH_URL
        value: https://bpr.rehab
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # AI — fill in after blueprint deployment
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

      # Voice AI (Vapi)
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false

      # AWS S3 (optional — for persistent image uploads)
      - key: AWS_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_FOLDER_PREFIX
        value: uploads/

      # Email (optional)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Stripe payments (optional)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Open Wearables — set after ow-backend deploys
      - key: OPEN_WEARABLES_API_URL
        sync: false
      - key: OPEN_WEARABLES_API_KEY
        sync: false
      - key: OPEN_WEARABLES_WEBHOOK_SECRET
        sync: false

  # Open Wearables — wearable data aggregation (Oura, Garmin, Whoop, Fitbit)
  # Runs API + Celery worker + beat in a single container
  - type: web
    name: ow-backend
    runtime: image
    image:
      url: docker.io/themomentum/open-wearables-backend:sha-bbc5686
    region: frankfurt
    plan: starter
    dockerCommand: >-
      bash -c '
      set -e;
      echo "Running migrations...";
      uv run alembic upgrade head;
      echo "Initializing...";
      uv run python scripts/init_provider_settings.py;
      uv run python scripts/init_device_priorities.py;
      uv run python scripts/init/seed_admin.py;
      uv run python scripts/init/seed_series_types.py;
      uv run python scripts/init/seed_archival_settings.py;
      echo "Starting Celery worker...";
      uv run celery -A app.main:celery_app worker --loglevel=info --pool=threads -Q default,sdk_sync,garmin_sync,webhook_sync &
      rm -f celerybeat.pid;
      uv run celery -A app.main:celery_app beat -l info &
      echo "Starting API...";
      exec uv run fastapi run app/main.py --host 0.0.0.0 --port ${PORT:-10000}
      '
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: bpr-clinic-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bpr-clinic-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: bpr-clinic-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bpr-clinic-db
          property: password
      - key: DB_NAME
        value: bpr_clinic
      - key: REDIS_HOST
        value: red-d95vgtvavr4c73camfmg
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_SSL
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://bpr.rehab"]'
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://bpr.rehab
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: HISTORICAL_SYNC_ON_CONNECT
        value: "true"
      # Provider OAuth — fill in after deployment
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: GARMIN_CLIENT_ID
        sync: false
      - key: GARMIN_CLIENT_SECRET
        sync: false
      - key: WHOOP_CLIENT_ID
        sync: false
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: FITBIT_CLIENT_ID
        sync: false
      - key: FITBIT_CLIENT_SECRET
        sync: false

databases:
  - name: bpr-clinic-db
    databaseName: bpr_clinic
    user: bpr_clinic
    region: frankfurt
    plan: starter

