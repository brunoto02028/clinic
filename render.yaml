# Render Infrastructure as Code — BPR Clinic
# Deploy via: dashboard.render.com → New → Blueprint → connect GitHub repo brunoto02028/clinic
# Render will read this file and create EVERYTHING automatically.
# After blueprint setup, fill in the SECRET values marked with sync: false

services:
  - type: web
    name: bpr-clinic
    env: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Database — auto-linked to the Render PostgreSQL below
      - key: DATABASE_URL
        fromDatabase:
          name: bpr-clinic-db
          property: connectionString

      # Auth
      - key: NEXTAUTH_URL
        value: https://bpr.rehab
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # AI — fill in after blueprint deployment
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

      # Voice AI (Vapi)
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false

      # AWS S3 (optional — for persistent image uploads)
      - key: AWS_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_FOLDER_PREFIX
        value: uploads/

      # Email (optional)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Stripe payments (optional)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: bpr-clinic-db
    databaseName: bpr_clinic
    user: bpr_clinic
    region: frankfurt
    plan: starter
