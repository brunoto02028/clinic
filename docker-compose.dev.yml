version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bpr-clinic-db-local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bpr_clinic_local
    volumes:
      - bpr_clinic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bpr_clinic_pg_data:
