<!DOCTYPE html>
<html>
<head>
  <title>Test Upload</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 10px 20px; margin: 10px; }
    #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Test Upload API</h1>
  
  <input type="file" id="fileInput" accept="image/*">
  <button onclick="testUpload()">Upload</button>
  <button onclick="testDelete()">Delete Last</button>
  
  <div id="result"></div>
  
  <script>
    let lastImageId = null;
    
    async function testUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Select a file first');
        return;
      }
      
      const formData = new FormData();
      formData.append('file', file);
      formData.append('category', 'general');
      
      document.getElementById('result').innerHTML = 'Uploading...';
      
      try {
        const res = await fetch('http://localhost:3000/api/upload', {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });
        
        const data = await res.json();
        
        if (res.ok) {
          lastImageId = data.image.id;
          document.getElementById('result').innerHTML = `
            <h3>✅ Upload Success!</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } else {
          document.getElementById('result').innerHTML = `
            <h3>❌ Upload Failed</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        }
      } catch (error) {
        document.getElementById('result').innerHTML = `
          <h3>❌ Error</h3>
          <pre>${error.message}</pre>
        `;
      }
    }
    
    async function testDelete() {
      if (!lastImageId) {
        alert('Upload an image first');
        return;
      }
      
      document.getElementById('result').innerHTML = 'Deleting...';
      
      try {
        const res = await fetch('http://localhost:3000/api/upload/delete', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cloud_storage_path: 'dataurl:test' }),
          credentials: 'include'
        });
        
        const data = await res.json();
        
        if (res.ok) {
          document.getElementById('result').innerHTML = `
            <h3>✅ Delete Success!</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        } else {
          document.getElementById('result').innerHTML = `
            <h3>❌ Delete Failed</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
        }
      } catch (error) {
        document.getElementById('result').innerHTML = `
          <h3>❌ Error</h3>
          <pre>${error.message}</pre>
        `;
      }
    }
  </script>
</body>
</html>
